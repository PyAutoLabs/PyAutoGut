name: Gut Void

# The Gut board's "Void permanently" button lands here. The button is a
# prefilled issue — `void: <name>` or `void: all-due` — and SUBMITTING it is
# the human's `--yes`. This workflow then:
#
#   1. refuses anyone who is not an owner / member / collaborator (comment +
#      close as not planned: this is a public repo, and a stranger's issue
#      must never delete anything);
#   2. recomputes the plan from the truth — `git ls-remote` of this repo and
#      the Mind's condemned.md parsed by the Brain's parser (both checked out
#      read-only) — via `scripts/board.py --void-plan`;
#   3. for each (repo, name) — repo is the Gut itself, or the sibling repo
#      the ledger says the ref is held on (`… on <Repo> origin`): re-reads its
#      SHA with `git ls-remote` (absent → skipped with a note), then deletes
#      refs/heads/archive/condemned/<name> there, then re-checks it is gone.
#      In the Gut: `git push origin --delete` with this repo's GITHUB_TOKEN.
#      On a sibling: a one-hour `pyautolabs-bot` App token (contents write,
#      every installed repo), minted in this job and handed to git through
#      `gh auth setup-git`, from an empty scratch repo — never in a URL;
#   4. comments a table (repo | name | pre-delete sha | result), closes the
#      issue as completed and re-dispatches the Gut Board.
#
# Refused, always: a name outside the archive namespace (`..`, a leading `/`
# or `-`, `refs/…`, globs, spaces), `main`, an empty name, and any HELD
# entry (undated / `sweep-after: never` — voided only in a session on explicit
# human request), in the Gut or on a sibling. `void: all-due` takes the due
# set only: never undated entries, never refs without a ledger entry.
#
# Sibling reach: a token that cannot be minted fails the job (the issue is
# commented and left open); a sibling that refuses the App token (403) → a
# per-ref failure row naming the repo, and the issue is LEFT OPEN — it closes
# as completed only when every requested ref was voided or absent (skipped by
# design).
#
# `workflow_dispatch` with `dry_run: true` runs only the `probe` job: it
# computes the same plan, mints the same token and runs `git ls-remote` +
# `git push --dry-run --delete` for every due ref (no pack is sent, no ref
# moves) — proof of the credential that deletes nothing, comments nothing and
# closes nothing.
#
# The label is a hint, not a gate: GitHub's issue form can drop `labels=` on
# submission (seen on the Memory queue from phones), so the `void:` title
# prefix alone is enough; the label is put back best-effort for the record.
#
# Scope: neither token edits the Mind, so the voided entry stays in condemned.md until a
# session retires it — the board shows it as "voided — entry still in
# condemned.md" with a copy-for-Claude payload. On any failure the issue is
# commented and LEFT OPEN.

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prove the void credential: push --dry-run --delete every due ref, change nothing"
        type: boolean
        default: false

# contents: write → delete the ref; issues: write → label, comment, close;
# actions: write → re-dispatch gut_board.yml (token pushes/closes do not
# retrigger workflows on their own).
permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: gut-void-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  refuse:
    name: Refuse a void from outside the org
    if: >-
      (startsWith(github.event.issue.title, 'void:') ||
       contains(github.event.issue.labels.*.name, 'void')) &&
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                github.event.issue.author_association)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - name: Comment and close as not planned
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
            "Only owners, members and collaborators can void Gut refs. Nothing was deleted."
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason "not planned"

  void:
    name: Void the requested refs
    if: >-
      (startsWith(github.event.issue.title, 'void:') ||
       contains(github.event.issue.labels.*.name, 'void')) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
               github.event.issue.author_association)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      # Untrusted text: read from the environment, never interpolated.
      TITLE: ${{ github.event.issue.title }}
      NS: refs/heads/archive/condemned
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/PyAutoBrain
          path: PyAutoBrain

      - uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/PyAutoMind
          path: PyAutoMind

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Put the void label back (best-effort)
        run: |
          gh label create void --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "Gut board: void a condemned ref permanently" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label void || true

      - name: Compute the void plan from ls-remote + condemned.md
        run: |
          python scripts/board.py --mind PyAutoMind --brain PyAutoBrain \
            --collect snap.json
          python scripts/board.py --snapshot snap.json --void-plan > plan.json
          cat plan.json

      - name: Resolve the request into names
        id: resolve
        run: |
          valid_name() {
            local n="$1"
            [ -n "$n" ] || return 1
            [ "$n" != "main" ] || return 1
            case "$n" in
              *..*|/*|*/|*//*|-*|refs/*|*' '*|*'*'*) return 1 ;;
            esac
            [[ "$n" =~ ^[A-Za-z0-9._][A-Za-z0-9._/-]*$ ]] || return 1
          }
          # A repo comes from plan.json (the ledger), never from the title;
          # still, it must be a bare repo name under this owner.
          valid_repo() {
            local r="$1"
            [ -n "$r" ] && [ "$r" != "." ] && [ "$r" != ".." ] || return 1
            [[ "$r" =~ ^[A-Za-z0-9_.-]+$ ]] || return 1
          }
          own="${GITHUB_REPOSITORY#*/}"
          target="${TITLE#void:}"
          target="$(printf '%s' "$target" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          # names.txt / checked.txt: one `<repo><TAB><name>` per line.
          : > names.txt
          : > refused.md
          if [ "$(jq -r '.refs_listed' plan.json)" != "true" ]; then
            echo "The Gut's refs could not be listed — nothing was deleted." > refused.md
          elif [ "$target" = "all-due" ]; then
            # The due set only — due Gut refs and overdue refs held on sibling
            # repos; undated (held) and orphan refs are never in it.
            # scripts/board.py builds it from the ledger.
            jq -r '.due[] | [.repo, .name] | @tsv' plan.json > names.txt
          elif ! valid_name "$target"; then
            echo "Refused: \`$target\` is not a name inside $NS/ (empty, \`main\`, \`..\`, a leading \`/\` or \`-\`, \`refs/\`, a glob or a space)." > refused.md
          elif jq -e --arg n "$target" '.held | map(.name) | index($n)' plan.json >/dev/null; then
            echo "Refused: \`$target\` is HELD (its ledger entry is undated / \`sweep-after: never\`). Held refs are voided only in a session on explicit human request: \`bin/pyauto-gut void $target --yes\`." > refused.md
          else
            hits=$(jq -r --arg n "$target" '[.voidable[] | select(.name == $n)] | length' plan.json)
            if [ "$hits" -gt 1 ]; then
              echo "Refused: \`$target\` names refs on more than one repo ($(jq -r --arg n "$target" '[.voidable[] | select(.name == $n) | .repo] | join(", ")' plan.json)) — void it in a session." > refused.md
            elif [ "$hits" = "1" ]; then
              jq -r --arg n "$target" '.voidable[] | select(.name == $n) | [.repo, .name] | @tsv' plan.json > names.txt
            else
              # Not in the plan: try the Gut itself (absent → skipped).
              printf '%s\t%s\n' "$own" "$target" > names.txt
            fi
          fi
          # Belt and braces: every (repo, name), however it arrived, passes
          # the same checks before anything is deleted.
          : > checked.txt
          while IFS=$'\t' read -r r n; do
            [ -n "$r$n" ] || continue
            if valid_repo "$r" && valid_name "$n"; then printf '%s\t%s\n' "$r" "$n" >> checked.txt
            else echo "Refused: \`$r\` / \`$n\` failed the repo / namespace check." >> refused.md; fi
          done < names.txt
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "count=$(wc -l < checked.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      # Owner-wide (no `repositories:`): a void can name a ref held on any
      # sibling repo, and the App is installed on every repo, so a repo born
      # tomorrow is reachable with no token edit. contents: write is the
      # delete; nothing else.
      - name: Mint App token (every installed repo — delete sibling refs)
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: PyAutoLabs
          permission-contents: write

      - name: Void each ref (ls-remote → push --delete → verify)
        id: void
        env:
          # Only this step sees the App token; it is used for sibling repos only.
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          own="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          fail=0
          : > token_failed.txt
          # Sibling repos: gh is git's credential helper (`gh auth setup-git`)
          # and reads the App token from GH_TOKEN, set per call below. They
          # run from an empty scratch repo, so the checkout's persisted
          # GITHUB_TOKEN header (local to ITS .git/config) never rides along;
          # in the Gut itself that header is exactly what deletes, with this
          # repo's own token.
          GH_TOKEN="$APP_TOKEN" gh auth setup-git
          sib=$(mktemp -d)
          git -C "$sib" init -q
          sibling_git() {
            GH_TOKEN="$APP_TOKEN" GIT_TERMINAL_PROMPT=0 git -C "$sib" "$@"
          }
          {
            echo "| repo | name | pre-delete sha | result |"
            echo "|---|---|---|---|"
          } > table.md
          while IFS=$'\t' read -r repo name; do
            [ -n "$name" ] || continue
            ref="$NS/$name"
            if [ "$repo" = "$own" ]; then
              sha=$(git ls-remote origin "$ref" | awk '{print $1}')
              if [ -z "$sha" ]; then
                echo "| $repo | \`$name\` | — | absent on the remote — skipped |" >> table.md
                continue
              fi
              if git push origin --delete "$ref"; then
                left=$(git ls-remote origin "$ref" | awk '{print $1}')
                if [ -z "$left" ]; then
                  echo "| $repo | \`$name\` | \`$sha\` | voided |" >> table.md
                else
                  echo "| $repo | \`$name\` | \`$sha\` | **still present after delete** |" >> table.md
                  fail=1
                fi
              else
                echo "| $repo | \`$name\` | \`$sha\` | **delete failed** |" >> table.md
                fail=1
              fi
              continue
            fi
            # A ref held on a sibling repo: the App token.
            url="https://github.com/$owner/$repo.git"
            if ! listing=$(sibling_git ls-remote "$url" "$ref" 2>ls.err); then
              echo "| $repo | \`$name\` | — | **failed: could not read $repo with the App token** — left in place |" >> table.md
              sed 's/^/  /' ls.err || true
              echo "$repo" >> token_failed.txt
              fail=1
              continue
            fi
            sha=$(printf '%s\n' "$listing" | awk '{print $1}')
            if [ -z "$sha" ]; then
              echo "| $repo | \`$name\` | — | absent on the remote — skipped |" >> table.md
              continue
            fi
            if sibling_git push "$url" --delete "$ref" 2>push.err; then
              if left=$(sibling_git ls-remote "$url" "$ref" 2>/dev/null); then
                left=$(printf '%s\n' "$left" | awk '{print $1}')
                if [ -z "$left" ]; then
                  echo "| $repo | \`$name\` | \`$sha\` | voided |" >> table.md
                else
                  echo "| $repo | \`$name\` | \`$sha\` | **still present after delete** |" >> table.md
                  fail=1
                fi
              else
                echo "| $repo | \`$name\` | \`$sha\` | **failed: delete sent but could not re-read $repo to verify** |" >> table.md
                fail=1
              fi
            else
              reason="delete failed"
              grep -q '403' push.err && reason="delete failed: 403 — the App token cannot push to $repo"
              echo "| $repo | \`$name\` | \`$sha\` | **$reason** — left in place |" >> table.md
              sed 's/^/  /' push.err || true
              echo "$repo" >> token_failed.txt
              fail=1
            fi
          done < checked.txt
          rm -rf "$sib"
          sort -u token_failed.txt -o token_failed.txt
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          cat table.md >> "$GITHUB_STEP_SUMMARY"

      - name: Report, close and re-render
        env:
          FAIL: ${{ steps.void.outputs.fail }}
          COUNT: ${{ steps.resolve.outputs.count }}
          TARGET: ${{ steps.resolve.outputs.target }}
        run: |
          {
            echo "## Gut void — \`$TARGET\`"
            echo
            if [ -s refused.md ]; then cat refused.md; echo; fi
            if [ "$COUNT" != "0" ]; then
              cat table.md
              echo
              if [ -s token_failed.txt ]; then
                echo "The pyautolabs-bot App token could not act on: $(paste -sd, token_failed.txt | sed 's/,/, /g'). The App is installed on every repo, so check the run log for that repo's refusal (installation or branch rules), then submit a new void issue. Those refs were left in place."
                echo
              fi
              echo "Voided refs are gone for good — **recovery is no longer possible**."
              echo "Their entries stay in PyAutoMind/condemned.md until a session retires them (the board lists them)."
            elif [ ! -s refused.md ]; then
              echo "Nothing to void — the request resolved to no refs."
            fi
          } > comment.md
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          if [ "$FAIL" = "1" ]; then
            echo "::error::at least one requested ref was not voided — issue left open"
            exit 1
          fi
          if [ -s refused.md ] && [ "$COUNT" = "0" ]; then
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason "not planned"
          else
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
          fi
          gh workflow run gut_board.yml --repo "$GITHUB_REPOSITORY" --ref main || true

      # (The report step already commented when a delete itself failed.)
      - name: Say so on failure and leave the issue open
        if: failure() && steps.void.outputs.fail != '1'
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
            "The Gut void run failed ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). The issue is left open; check the run log before retrying." || true

  probe:
    name: Prove the void credential (dry run)
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NS: refs/heads/archive/condemned
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/PyAutoBrain
          path: PyAutoBrain

      - uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/PyAutoMind
          path: PyAutoMind

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute the void plan from ls-remote + condemned.md
        run: |
          python scripts/board.py --mind PyAutoMind --brain PyAutoBrain \
            --collect snap.json
          python scripts/board.py --snapshot snap.json --void-plan > plan.json
          jq -r '.due[] | [.repo, .name] | @tsv' plan.json > due.txt
          cat due.txt

      - name: Mint App token (every installed repo — delete sibling refs)
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: PyAutoLabs
          permission-contents: write

      - name: ls-remote + push --dry-run --delete each due sibling ref
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          own="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          GH_TOKEN="$APP_TOKEN" gh auth setup-git
          sib=$(mktemp -d)
          git -C "$sib" init -q
          fail=0
          probed=0
          {
            echo "## Gut void — dry run (nothing deleted)"
            echo
            echo "| repo | name | ls-remote | push --dry-run --delete |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r repo name; do
            [ -n "$name" ] && [ "$repo" != "$own" ] || continue
            url="https://github.com/$owner/$repo.git"
            ref="$NS/$name"
            if ! sha=$(GH_TOKEN="$APP_TOKEN" git -C "$sib" ls-remote "$url" "$ref" | awk '{print $1}') || [ -z "$sha" ]; then
              echo "| $repo | \`$name\` | **unreadable or absent** | — |" >> "$GITHUB_STEP_SUMMARY"
              fail=1; continue
            fi
            if GH_TOKEN="$APP_TOKEN" GIT_TERMINAL_PROMPT=0 git -C "$sib" push --dry-run "$url" --delete "$ref"; then
              echo "| $repo | \`$name\` | \`$sha\` | ok |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $repo | \`$name\` | \`$sha\` | **refused** |" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
            probed=$((probed + 1))
          done < due.txt
          rm -rf "$sib"
          echo "probed $probed sibling ref(s)"
          if [ "$probed" = "0" ]; then
            echo "::warning::no due sibling refs to probe — the credential was minted but not exercised"
          fi
          [ "$fail" = "0" ] || { echo "::error::the App token could not reach at least one sibling ref"; exit 1; }
